name: Wirtschaftskalender
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kalender laden
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime as dt, os
          UA = {'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1'}
          def get(url, extra={}):
              req = urllib.request.Request(url, headers={**UA, **extra})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          ev, src = [], ''
          try:
              d0 = dt.datetime.now(dt.timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
              f = (d0 - dt.timedelta(days=2)).strftime('%Y-%m-%dT%H:%M:%S.000Z')
              t = (d0 + dt.timedelta(days=9)).strftime('%Y-%m-%dT%H:%M:%S.000Z')
              j = get(f'https://economic-calendar.tradingview.com/events?from={f}&to={t}&countries=US,EU,GB,JP,CN,DE',
                      {'Origin': 'https://www.tradingview.com', 'Referer': 'https://www.tradingview.com/'})
              iso = {'US':'USD','EU':'EUR','DE':'EUR','GB':'GBP','JP':'JPY','CN':'CNY'}
              def v(x, u):
                  return '' if x is None else f'{x}{u or ""}'
              for e in j.get('result', []):
                  imp = e.get('importance', -1)
                  ev.append({'title': e.get('title') or e.get('indicator') or '', 'country': e.get('currency') or iso.get(e.get('country'), e.get('country', '')),
                             'date': e.get('date'), 'impact': 'High' if imp >= 1 else 'Medium' if imp == 0 else 'Low',
                             'forecast': v(e.get('forecast'), e.get('unit')), 'previous': v(e.get('previous'), e.get('unit')), 'actual': v(e.get('actual'), e.get('unit'))})
              src = 'TradingView'
          except Exception as e:
              print('TradingView fehlgeschlagen:', e)
          if not ev:
              try:
                  ev = get('https://nfs.faireconomy.media/ff_calendar_thisweek.json')
                  src = 'ForexFactory'
              except Exception as e:
                  print('ForexFactory fehlgeschlagen:', e)
          if not ev:
              raise SystemExit('Keine Daten – alte Datei bleibt')
          old = None
          if os.path.exists('calendar.json'):
              try: old = json.load(open('calendar.json')).get('events')
              except Exception: pass
          if old == ev:
              print('Unverändert'); raise SystemExit(0)
          json.dump({'updated': dt.datetime.now(dt.timezone.utc).isoformat(), 'source': src, 'events': ev}, open('calendar.json', 'w'), ensure_ascii=False)
          print(src, len(ev), 'Termine')
          PY
      - name: Speichern
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add calendar.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Kalender aktualisiert" && git push)
